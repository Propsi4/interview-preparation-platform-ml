[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

known_pandas = "pandas,numpy"
sections = "FUTURE,STDLIB,THIRDPARTY,PANDAS,FIRSTPARTY,LOCALFOLDER"

import_heading_stdlib = "Standart library imports"
import_heading_thirdparty = "Thirdparty imports"
import_heading_firstparty = "Local imports"
import_heading_localfolder = "Local folder imports"

[tool.poetry]
name = "interview_agent"
version = "0.1.0"
description = "A platform to analyze the IT vacancies and prepare the candidate for the interview  ."
authors = ["Vadym Burylo <gaenday328@gmail.com>"]
readme = "README.md"
packages = [
    { include = "ml" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
flake8-docstrings = "^1.7.0"
mypy = "^1.13.0"
poetry = "^2.1.3"
pre-commit = "^4.0.1"
ipykernel = "^6.29.5"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
