[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

known_pandas = "pandas,numpy"
sections = "FUTURE,STDLIB,THIRDPARTY,PANDAS,FIRSTPARTY,LOCALFOLDER"

import_heading_stdlib = "Standart library imports"
import_heading_thirdparty = "Thirdparty imports"
import_heading_firstparty = "Local imports"
import_heading_localfolder = "Local folder imports"

[tool.poetry]
name = "ml"
version = "0.1.0"
description = "A platform to analyze the IT vacancies and prepare the candidate for the interview  ."
authors = ["Vadym Burylo <gaenday328@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pydantic = "^2.12.5"
sqlalchemy = "^2.0.45"
alembic = "^1.16.5"
python-dotenv = "^1.2.1"
pydantic-settings = "^2.12.0"
psycopg2-binary = "^2.9.11"
asyncpg = "^0.31.0"
playwright = "^1.57.0"
loguru = "^0.7.3"
celery = {extras = ["redis"], version = "^5.6.2"}
fastapi = "^0.128.0"
uvicorn = "^0.34.0"
dspy = "^3.1.2"
langchain = "^1.2.7"
streamlit = "^1.53.1"
httpx = "^0.28.1"
python-multipart = "^0.0.22"
websockets = "^16.0"
openai = "^2.16.0"


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
flake8 = "^7.1.1"
flake8-docstrings = "^1.7.0"
mypy = "^1.13.0"
poetry = "^2.1.3"
pre-commit = "^4.0.1"
ipykernel = "^6.29.5"
isort = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
